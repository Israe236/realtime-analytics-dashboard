[project]
name = "event-generator"
version = "0.1.0"
description = "Synthetic e-commerce order event stream (daily curve, bursts, anomalies, malformed events)"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28",
    "orjson>=3.10",
    "pydantic-settings>=2.7",
]

[project.scripts]
event-generator = "event_generator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/event_generator"]
