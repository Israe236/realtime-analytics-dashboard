name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python · lint, types, tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: analytics
          POSTGRES_PASSWORD: analytics
          POSTGRES_DB: analytics
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U analytics -d analytics"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://analytics:analytics@localhost:55432/postgres
    steps:
      - uses: actions/checkout@v7
      # setup-uv publishes exact release tags only (no moving "v10" tag).
      - uses: astral-sh/setup-uv@v10.1.0
      - name: Install
        run: uv sync --frozen
      - name: Ruff (lint)
        run: uv run --frozen ruff check .
      - name: Ruff (format)
        run: uv run --frozen ruff format --check .
      - name: Mypy (strict)
        run: uv run --frozen mypy backend/src backend/tests generator/src generator/tests bench/src scripts
      - name: Pytest
        run: uv run --frozen pytest -q
      - name: TypeScript protocol is up to date with the Pydantic models
        run: uv run --frozen python scripts/gen_ts_types.py --check

  frontends:
    name: Frontend · ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: shared
            script: npm test && npx tsc --noEmit
          - app: web-react
            script: npm run lint && npm test && npm run build
          - app: web-angular
            script: npx ng build && npx ng test --watch=false
          - app: mobile-react-native
            script: npx tsc --noEmit && npx expo export --platform web
    defaults:
      run:
        working-directory: frontends/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontends/${{ matrix.app }}/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Check
        run: ${{ matrix.script }}

  docker:
    name: Docker · compose build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build every image
        run: docker compose build
