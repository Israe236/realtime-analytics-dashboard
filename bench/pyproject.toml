[project]
name = "bench"
version = "0.1.0"
description = "Load test: sustained ingest throughput and end-to-end latency to WebSocket clients"
requires-python = ">=3.13"
dependencies = [
    "event-generator",
    "httpx>=0.28",
    "websockets>=14",
    "orjson>=3.10",
]

[tool.uv.sources]
event-generator = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bench"]
