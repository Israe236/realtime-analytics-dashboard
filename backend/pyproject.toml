[project]
name = "analytics-api"
version = "0.1.0"
description = "Ingestion API, incremental aggregation, alerting and WebSocket fan-out"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "asyncpg>=0.30",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "orjson>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analytics_api"]

[tool.hatch.build.targets.wheel.force-include]
"src/analytics_api/db/migrations" = "analytics_api/db/migrations"
