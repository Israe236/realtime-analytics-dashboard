# Shared by the three dashboard images. Serves the static build and proxies the API on the
# same origin, so the browser needs no CORS and the WebSocket URL is simply /ws/live.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /ws/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Keep idle-but-healthy WebSockets open (the server pings every 15 s) and never
        # buffer: a buffered push is a delayed push.
        proxy_read_timeout 1h;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
